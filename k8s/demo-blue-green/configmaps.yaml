apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-v1-html
  labels:
    app: my-nginx
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>Despliegue - Version 1 (Azul)</title>
      <style>
        body { font-family: sans-serif; background-color: #3498db; color: white; text-align: center; padding-top: 100px; }
        h1 { font-size: 50px; }
      </style>
    </head>
    <body>
      <h1>ENTORNO AZUL - Version 1.0.0</h1>
      <p>Este es el sitio web estable de produccion.</p>
    </body>
    </html>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-v2-html
  labels:
    app: my-nginx
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>Despliegue - Version 2 (Verde)</title>
      <style>
        body { font-family: sans-serif; background-color: #2ecc71; color: white; text-align: center; padding-top: 100px; }
        h1 { font-size: 50px; }
      </style>
    </head>
    <body>
      <h1>ENTORNO VERDE - Version 2.0.0</h1>
      <p>¡Despliegue exitoso de la nueva version!</p>
    </body>
    </html>
